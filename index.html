<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance System</title>
  <link rel="stylesheet" href="css/style.css?v=89">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:16px;color:#666;">正在加载数据，请稍候...</div></div>
  <script src="js/db.js?v=116"></script>
  <script src="js/app.js?v=115"></script>
  <script src="js/employee.js?v=115"></script>
  <script src="js/admin.js?v=130"></script>
  <script>
    // 先从云端同步最新数据，确保跨设备/新设备能拿到完整数据
    // 同步完成后再启动应用（避免先用空/旧本地数据渲染导致首页空白）
    DB.init().then(function() {
      console.log('[PMS] 云端数据同步完成，启动应用');
      App.init();
    }).catch(function(e) {
      console.warn('[PMS] 云端同步失败，使用本地数据:', e);
      App.init();
    });
  </script>
</body>
</html>
